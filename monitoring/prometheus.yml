global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'lorcana-proxy'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Lorcana Proxy Print application
  - job_name: 'lorcana-proxy-print'
    static_configs:
      - targets: ['app:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Node exporter (if deployed)
  - job_name: 'node-exporter'
    static_configs:
      - targets: []
    # Uncomment when deploying node-exporter
    # - targets: ['node-exporter:9100']
